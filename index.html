<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>QR Studio</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">QR Studio</span>
      </div>
      <p class="tagline">QR Codes personalizados, gerados no seu navegador.</p>
    </header>

    <main class="layout">
      <form class="panel" id="settings" autocomplete="off" novalidate>
        <section class="card">
          <h2>Conteúdo</h2>
          <div class="segmented" role="radiogroup" aria-label="Tipo de conteúdo">
            <label><input type="radio" name="contentType" value="whatsapp" /><span>WhatsApp</span></label>
            <label><input type="radio" name="contentType" value="url" /><span>URL</span></label>
            <label><input type="radio" name="contentType" value="text" /><span>Texto</span></label>
          </div>

          <div class="fields" data-show="url">
            <label class="field">
              <span>URL</span>
              <input type="url" name="url" inputmode="url" placeholder="https://exemplo.com" />
            </label>
          </div>

          <div class="fields" data-show="whatsapp">
            <label class="field">
              <span>Telefone (com DDI e DDD)</span>
              <input type="tel" name="phone" inputmode="tel" placeholder="+55 16 99999-9999" />
            </label>
            <label class="field">
              <span>Mensagem</span>
              <textarea name="message" rows="6"></textarea>
            </label>
          </div>

          <div class="fields" data-show="text">
            <label class="field">
              <span>Texto</span>
              <textarea name="text" rows="5" placeholder="Digite qualquer texto"></textarea>
            </label>
          </div>
          <p class="hint" id="content-meta"></p>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Estilo</h2>
            <button type="button" class="link" id="preset-reset">Restaurar preset</button>
          </div>
          <div class="presets" role="radiogroup" aria-label="Preset">
            <label class="preset">
              <input type="radio" name="preset" value="wedding" />
              <span class="swatch" style="--a: #627a61; --b: #faf9f5"></span>
              <span>Wedding Sage</span>
            </label>
            <label class="preset">
              <input type="radio" name="preset" value="minimal" />
              <span class="swatch" style="--a: #000; --b: #fff"></span>
              <span>Minimal Black</span>
            </label>
            <label class="preset">
              <input type="radio" name="preset" value="custom" />
              <span class="swatch swatch-custom"></span>
              <span>Custom</span>
            </label>
          </div>

          <div class="row">
            <label class="color">
              <input type="color" name="dotColor" />
              <span>Módulos</span>
              <code data-color-label="dotColor"></code>
            </label>
            <label class="color">
              <input type="color" name="bgColor" />
              <span>Fundo</span>
              <code data-color-label="bgColor"></code>
            </label>
          </div>
          <label class="toggle">
            <input type="checkbox" name="transparentBg" />
            <span>Fundo transparente</span>
          </label>

          <fieldset class="group">
            <legend>Módulos</legend>
            <div class="chips">
              <label><input type="radio" name="dotType" value="square" /><span>Quadrados</span></label>
              <label><input type="radio" name="dotType" value="dots" /><span>Circulares</span></label>
              <label><input type="radio" name="dotType" value="rounded" /><span>Arredondados</span></label>
              <label><input type="radio" name="dotType" value="extra-rounded" /><span>Extra-arredondados</span></label>
              <label><input type="radio" name="dotType" value="classy" /><span>Classy</span></label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>Marcadores de canto</legend>
            <div class="chips">
              <label><input type="radio" name="cornerSquareType" value="square" /><span>Quadrado</span></label>
              <label><input type="radio" name="cornerSquareType" value="rounded" /><span>Arredondado</span></label>
              <label><input type="radio" name="cornerSquareType" value="extra-rounded" /><span>Extra-arredondado</span></label>
              <label><input type="radio" name="cornerSquareType" value="dot" /><span>Circular</span></label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>Ponto interno dos marcadores</legend>
            <div class="chips">
              <label><input type="radio" name="cornerDotType" value="square" /><span>Quadrado</span></label>
              <label><input type="radio" name="cornerDotType" value="rounded" /><span>Arredondado</span></label>
              <label><input type="radio" name="cornerDotType" value="dot" /><span>Circular</span></label>
            </div>
          </fieldset>
        </section>

        <section class="card">
          <h2>Logo central</h2>
          <div class="logo-row">
            <label class="upload">
              <input type="file" name="logo" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
              <span id="logo-label">Escolher imagem</span>
            </label>
            <button type="button" class="ghost" id="logo-remove" hidden>Remover</button>
          </div>
          <label class="field range" data-logo-only>
            <span>Tamanho do logo <output id="logoSize-out"></output></span>
            <input type="range" name="logoSize" min="0.15" max="0.4" step="0.01" />
          </label>
        </section>

        <section class="card">
          <h2>Saída</h2>
          <label class="field range">
            <span>Tamanho da imagem <output id="size-out"></output></span>
            <input type="range" name="size" min="512" max="4096" step="256" />
          </label>
          <label class="field range">
            <span>Margem externa <output id="margin-out"></output></span>
            <input type="range" name="marginPct" min="2" max="15" step="1" />
          </label>
          <label class="field">
            <span>Correção de erros</span>
            <select name="ecl">
              <option value="L">L — 7%</option>
              <option value="M">M — 15%</option>
              <option value="Q">Q — 25%</option>
              <option value="H">H — 30%</option>
            </select>
          </label>
          <p class="hint" id="ecl-hint" hidden>Com logo, o nível H é usado automaticamente.</p>
        </section>
      </form>

      <aside class="preview-col">
        <div class="preview-card">
          <div class="preview" id="preview" aria-label="Pré-visualização do QR Code" role="img"></div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="qr-meta" id="qr-meta"></p>
          <ul class="warnings" id="warnings" aria-live="polite"></ul>

          <section class="print" aria-labelledby="print-title">
            <div class="print-head">
              <h3 id="print-title">Tamanho impresso</h3>
              <div class="segmented compact" role="radiogroup" aria-label="Tamanho impresso">
                <label><input type="radio" name="printCm" value="3" /><span>3 cm</span></label>
                <label><input type="radio" name="printCm" value="4" /><span>4 cm</span></label>
                <label><input type="radio" name="printCm" value="5" /><span>5 cm</span></label>
              </div>
            </div>
            <div class="paper">
              <img id="print-img" alt="QR Code no tamanho impresso selecionado" />
            </div>
            <p class="hint" id="print-meta"></p>
          </section>

          <label class="field filename">
            <span>Nome do arquivo</span>
            <input type="text" id="fileName" name="fileName" spellcheck="false" />
          </label>

          <div class="actions">
            <button type="button" class="primary" id="dl-png">Baixar PNG</button>
            <button type="button" class="primary outline" id="dl-svg">Baixar SVG</button>
          </div>
          <div class="actions secondary">
            <button type="button" class="ghost" id="copy">Copiar link</button>
            <button type="button" class="ghost" id="test">Testar URL</button>
          </div>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
